; FrameGenNG production configuration for BeamNG.drive.
; User-facing controls are integrated into BeamNG graphics settings.

[Upscalers]
Dx12Upscaler=dlss

[FrameGen]
; Fail open: the native layer starts disabled and BeamNG's validated settings enable it at runtime.
Enabled=false
FGInput=upscaler
FGOutput=dlssg
FGNvngxReplacement=None
PreserveSwapChain=false

[DLSSG]
InterpolationCount=1
UseGamesReflexMarkers=false

[OptiFG]
DisableHUDFix=true
HUDFix=false

[Inputs]
EnableDlssInputs=true
EnableXeSSInputs=false
EnableFsr2Inputs=false
EnableFsr3Inputs=false
EnableFfxInputs=false
EnableHotSwapping=false

[Libraries]
OptiDllPath=.\FrameGenNG

[Menu]
OverlayMenu=false
ShortcutKey=-1
DisableSplash=true
ShowFps=false
FpsShortcutKey=-1
FpsCycleShortcutKey=-1
FGShortcutKey=-1

[Spoofing]
StreamlineSpoofing=true
Dxgi=false

[Plugins]
LoadAsiPlugins=false
LoadSpecialK=false
LoadReshade=false

[Hotfix]
; Steam remains available for Steam Input. Other known overlays stay blocked by the renderer.
DisableOverlays=true

[fakenvapi]
UseFakenvapi=false

[OutputScaling]
Enabled=false

[CAS]
Enabled=false
MotionSharpnessEnabled=false
ContrastEnabled=false

[Magnifier]
Enabled=false

[Log]
LogToFile=false
LogLevel=2
LogToConsole=false
LogToNGX=false
LogToDebug=false
OpenConsole=false

[HDR]
; Automatically bridges BeamNG scRGB to HDR10 only when Windows HDR and in-game HDR are both active.
ForceHDR=true
UseHDR10=true
SkipColorSpace=false
