; FrameGenNG production configuration for BeamNG.drive.
; User-facing controls are integrated into BeamNG graphics settings.

[Upscalers]
Dx12Upscaler=dlss

[FrameGen]
; Fail open: the native layer starts disabled and BeamNG's validated settings enable it at runtime.
Enabled=false
FGInput=upscaler
FGOutput=dlssg
FGNvngxReplacement=None
PreserveSwapChain=false

[DLSSG]
InterpolationCount=1
UseGamesReflexMarkers=false

[OptiFG]
DisableHUDFix=true
HUDFix=false

[Inputs]
EnableDlssInputs=true
EnableXeSSInputs=true
EnableFsr2Inputs=false
EnableFsr3Inputs=true
EnableFfxInputs=true
EnableHotSwapping=false

[Libraries]
OptiDllPath=.\FrameGenNG
FfxDx12Path=.\FrameGenNG\amd_fidelityfx_loader_dx12.dll
FfxDx12FGPath=.\FrameGenNG\amd_fidelityfx_framegeneration_dx12.dll
XeFGPath=.\FrameGenNG\libxess_fg.dll
XeLLPath=.\FrameGenNG\libxell.dll

[Menu]
OverlayMenu=false
ShortcutKey=-1
DisableSplash=true
ShowFps=false
FpsShortcutKey=-1
FpsCycleShortcutKey=-1
FGShortcutKey=-1

[Spoofing]
StreamlineSpoofing=true
Dxgi=false

[Plugins]
LoadAsiPlugins=false
LoadSpecialK=false
LoadReshade=false

[Hotfix]
; Steam remains available for Steam Input. Other known overlays stay blocked by the renderer.
DisableOverlays=true

[fakenvapi]
UseFakenvapi=false

[OutputScaling]
Enabled=false

[CAS]
Enabled=false
MotionSharpnessEnabled=false
ContrastEnabled=false

[Magnifier]
Enabled=false

[Log]
LogToFile=false
LogLevel=2
LogToConsole=false
LogToNGX=false
LogToDebug=false
OpenConsole=false

[HDR]
; DX12-only bridge. Vulkan keeps BeamNG's native scRGB presentation path.
ForceHDR=true
UseHDR10=true
SkipColorSpace=false
