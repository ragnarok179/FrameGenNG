; FrameGenNG compatibility engine configuration.
; Keep this file beside d3d12.dll and the FGNGEngine folder.
; Restart BeamNG.drive after changing a value.

[General]
Enabled=1

[FrameGeneration]
Engine=DLSS
MaxGeneratedFrames=3

[DLSSG]
Optimized=1
Preset=Auto

[Logging]
Level=1
Directory=FGNGEngine\logs

[Debug]
MarkGeneratedFrames=0
MarkerX=8
MarkerY=8
MarkerScale=2
MfgProbe=0

[Runtime]
Mode=Bundled

[SuperResolution]
Mode=Off
